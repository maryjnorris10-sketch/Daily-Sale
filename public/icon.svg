<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17B0B2"/>
      <stop offset="1" stop-color="#0A6E70"/>
    </linearGradient>
    <clipPath id="cap">
      <rect x="-70" y="-30" width="140" height="60" rx="30"/>
    </clipPath>
  </defs><rect width="512" height="512" rx="112" fill="url(#bg)"/><g transform="translate(0.0 0.0) scale(1)">

  <!-- House (ঘর) -->
  <polygon points="256,96 418,226 94,226" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
  <rect x="126" y="222" width="260" height="160" rx="12" fill="#FFFFFF"/>

  <!-- Medical cross (ঔষধ) -->
  <rect x="238" y="262" width="36" height="80" rx="8" fill="#0F8B8D"/>
  <rect x="216" y="284" width="80" height="36" rx="8" fill="#0F8B8D"/>

  <!-- Wholesale box (পাইকারি অর্ডার) -->
  <rect x="76" y="336" width="124" height="106" rx="18" fill="#0C7C7E"/>
  <rect x="86" y="346" width="104" height="28" rx="8" fill="#BFEDEE"/>
  <rect x="94" y="372" width="88" height="60" rx="8" fill="#FFFFFF"/>
  <rect x="126" y="346" width="24" height="86" fill="#17B0B2"/>

  <!-- Capsule -->
  <g transform="translate(398 392) rotate(-40)">
    <rect x="-80" y="-40" width="160" height="80" rx="40" fill="#0C7C7E"/>
    <g clip-path="url(#cap)">
      <rect x="-70" y="-30" width="70" height="60" fill="#FFFFFF"/>
      <rect x="0" y="-30" width="70" height="60" fill="#BFEDEE"/>
    </g>
    <rect x="-3" y="-30" width="6" height="60" fill="#0F8B8D" opacity="0.35"/>
  </g>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>